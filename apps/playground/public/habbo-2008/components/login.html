<!doctype html><html data-ds-preview data-example="login"><head><meta charset="utf-8"><title>Formulario de acceso</title><link rel="stylesheet" href="/habbo-2008/holocms/web-gallery/v2/styles/style.css"><link rel="stylesheet" href="/habbo-2008/holocms/web-gallery/v2/styles/buttons.css"><link rel="stylesheet" href="/habbo-2008/holocms/web-gallery/v2/styles/boxes.css"><link rel="stylesheet" href="/habbo-2008/holocms/web-gallery/v2/styles/tooltips.css"><link rel="stylesheet" href="/habbo-2008/holocms/web-gallery/v2/styles/process.css"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; form-action 'none'; connect-src 'none'; object-src 'none'"><style>body{margin:0;padding:0;text-align:left;background:transparent;width:300px}#content{width:auto;margin:0;padding:0}#header{width:930px}</style><link rel="stylesheet" href="/component-preview.css"></head><body id="landing"><div id="content"><div class="habblet-container"><div class="cbb loginbox clearfix">
    <h2 class="title">Sign in</h2>
    
    <div class="box-content clearfix" id="login-habblet">
        <form action="#unavailable" method="post" class="login-habblet">
            
            <ul>
                <li>
                    <label for="login-username" class="login-text">Username</label>
                    <input tabindex="1" type="text" class="login-field" name="credentials.username" id="login-username" value="" />
                </li>
                <li>
                    <label for="login-password" class="login-text">Password</label>
                    <input tabindex="2" type="password" class="login-field" name="credentials.password" id="login-password" />
	                    <input type="submit" value="Log in" class="submit" id="login-submit-button"/>
	                    <a href="#" id="login-submit-new-button" class="new-button" style="float: left; margin-left: 0;display:none"><b style="padding-left: 10px; padding-right: 7px; width: 55px">Log in</b><i></i></a>
                </li>
                <li class="no-label">
                    <input tabindex="3" type="checkbox" name="_login_remember_me" id="login-remember-me" value="true"/>
                    <label for="login-remember-me">Remember me</label>
                </li>   
                <li class="no-label">
                    <a href="#unavailable" class="login-register-link"><span>Register for free</span></a>
                </li>
                <li class="no-label">
                    <a href="#unavailable" id="forgot-password"><span>I forgot my password/username</span></a>
                </li>
            </ul>
        </form>

    </div>
</div></div></div><script src="/habbo-2008/local.js"></script></body></html>
